test = false
doc = false

[[bin]]
name = "fuzz_amount"
path = "fuzz_targets/fuzz_amount.rs"
test = false
doc = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "fuzz_models"
path = "fuzz_targets/fuzz_models.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hashes"
path = "fuzz_targets/fuzz_hashes.rs"
test = false
doc = false

[[bin]]
name = "fuzz_utils"
path = "fuzz_targets/fuzz_utils.rs"
