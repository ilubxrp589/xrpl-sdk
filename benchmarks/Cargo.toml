[package]
name = "halcyon-xrpl-benchmarks"
version = "0.0.0"
edition = "2021"
publish = false
description = "Benchmarks: halcyon-xrpl-core against xrpl-rust on the same inputs (see ../docs/BENCHMARKS.md)"

[dependencies]
xrpl-core = { package = "halcyon-xrpl-core", path = "../crates/xrpl-core" }
xrpl-rust = { version = "=1.3.0", default-features = false, features = ["std", "core"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "compare"
harness = false

# Not part of the workspace: it pulls in xrpl-rust, which the SDK never depends on.
[workspace]
