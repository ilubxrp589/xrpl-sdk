[workspace]
resolver = "2"
members = [
    "crates/xrpl-core",
    "crates/xrpl-client",
    "crates/xrpl-sdk",
    "crates/xrpl-cli",
]
exclude = ["fuzz"]

# The safety rules, enforced: no unsafe, and no unwrap/expect/unchecked
# indexing in library code (test modules opt out explicitly). Every public
# type can be printed with `{:?}` (secrets show as redacted).
[workspace.lints.rust]
unsafe_code = "forbid"
# `--cfg xrpl_live_tests` turns on the tests that talk to the XRPL Testnet.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(xrpl_live_tests)"] }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
# A narrowing `as` cast wraps silently: DestinationTag 2^32+12345 was once
# signed as 12345. Convert with try_from, or say why the value fits.
cast_possible_truncation = "deny"
missing_errors_doc = "warn"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
thiserror = { version = "2", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
ripemd = "0.1"
hmac = "0.12"
rand = "0.9"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
tokio = { version = "1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
k256 = { version = "0.14", features = ["ecdsa"] }
# The ECDSA crate k256 builds on: its hazmat signing (k256 does not re-export it).
ecdsa = { version = "0.17", default-features = false, features = ["algorithm"] }
futures = "0.3"
tracing = "0.1"
zeroize = { version = "1", features = ["derive", "alloc"] }
subtle = "2"
unicode-normalization = { version = "0.1", default-features = false }
