name: rippled definitions

# Every week, compare rippled's definitions (transaction types, fields, ledger
# entries, result codes, flags) on Devnet, Testnet and mainnet with the ones
# the SDK is generated from. When a network's rippled knows something new,
# open an issue that lists exactly what, and how to catch up. Devnet gets a
# new rippled first, so this warns before mainnet changes.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    name: Compare with the public networks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 crates/xrpl-core/scripts/check_definitions.py --report drift.md
      - name: Open an issue (once per difference)
        if: hashFiles('drift.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(head -1 drift.md | sed 's/^# //')"
          gh label create definitions-drift --color D93F0B \
            --description "rippled's definitions changed on a public network" 2>/dev/null || true
          if gh issue list --label definitions-drift --state open --limit 100 \
              --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "Already open: $title"
          else
            gh issue create --title "$title" --body-file drift.md --label definitions-drift
          fi
