name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # No public API breaks against the release on crates.io unless the
  # version says so.
  semver:
    name: SemVer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # What `cargo publish` would upload builds on its own, from the packaged
  # files only (a file left out of a crate fails here, not on crates.io).
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # The oldest Rust each crate supports (its `rust-version`), with the locked
  # dependencies: halcyon-xrpl-core needs 1.85, the rest 1.88 (for reqwest's
  # URL handling). A dependency update that raises either fails here.
  msrv:
    name: MSRV (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: "1.85.0"
            check: cargo check --locked -p halcyon-xrpl-core && cargo check --locked -p halcyon-xrpl-core --no-default-features
          - rust: "1.88.0"
            check: cargo check --locked --workspace --all-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # Warnings fail here too: the no_std build is only checked in this job.
      - run: ${{ matrix.check }}
        env:
          RUSTFLAGS: -D warnings

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --target wasm32-unknown-unknown -p halcyon-xrpl-core -p halcyon-xrpl-client --features wasm -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p halcyon-xrpl-sdk --features wasm -- -D warnings
      # The client's unit tests in Node.js: no browser window, as in a worker.
      - name: Install wasm-bindgen-test-runner (the version Cargo.lock pins)
        run: |
          V=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$V" --locked
      - run: cargo test --locked --target wasm32-unknown-unknown -p halcyon-xrpl-client --lib --features wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  # Each feature on its own builds, warning-free: none (the Client trait and
  # the types only), `http` only, `ws` only.
  features:
    name: Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          for crate in halcyon-xrpl-client halcyon-xrpl-sdk; do
            for features in "" "--features http" "--features ws"; do
              echo "== $crate --no-default-features $features"
              cargo clippy --locked --all-targets -p $crate --no-default-features $features -- -D warnings
            done
          done

  # The codec's definitions are the recorded rippled answer the transaction
  # models and ledger entry types are generated from (no network).
  definitions:
    name: Definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 crates/xrpl-core/scripts/check_definitions.py --offline

  # The crates outside the workspace build against this version too: the
  # benchmarks and the Cloudflare Worker example.
  extras:
    name: Benchmarks and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path benchmarks/Cargo.toml --benches
      - run: cargo check --manifest-path examples/cloudflare-worker/Cargo.toml --target wasm32-unknown-unknown

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # crates.io resolves a README's relative links from the crate's directory.
      - run: python3 scripts/check_readme_links.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # As docs.rs builds them: nightly, with `--cfg docsrs` (feature labels).
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  live-tests:
    name: Live Testnet Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Not continue-on-error: a failure against the live network shows.
      - run: cargo test --workspace
        env:
          RUSTFLAGS: --cfg xrpl_live_tests

  # Every dependency's licence is one deny.toml allows, from crates.io only,
  # with no wildcard versions.
  deny:
    name: Licences and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked && cargo audit
