[package]
name = "halcyon-xrpl-core"
version = "0.8.2"
edition = "2021"
rust-version = "1.88"
description = "XRP Ledger types, binary codec, Ed25519/secp256k1 signing, transaction hashes and ledger entry IDs, checked byte for byte against rippled"
license = "Apache-2.0"
repository = "https://github.com/ilubxrp589/xrpl-sdk"
authors = ["James Turner"]
readme = "../../README.md"
documentation = "https://docs.rs/halcyon-xrpl-core"
keywords = ["xrpl", "xrp", "ripple", "blockchain", "sdk"]
categories = ["cryptography::cryptocurrencies", "encoding", "no-std", "wasm"]

[lib]
name = "xrpl_core"
crate-type = ["rlib"]

[features]
default = ["std"]
std = ["serde/std", "serde_json", "hex/std", "rand", "thiserror/std", "bs58/std"]
wasm = ["wasm-bindgen", "js-sys", "getrandom", "std", "getrandom_03", "getrandom_04"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
ripemd = { workspace = true }
hmac = { workspace = true }
bs58 = { workspace = true }
ed25519-dalek = { workspace = true }
k256 = { workspace = true }
ecdsa = { workspace = true }
rand = { workspace = true, optional = true }
zeroize = { workspace = true }
subtle = { workspace = true }
unicode-normalization = { workspace = true }

# WASM support
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
# rand 0.9 draws on getrandom 0.3, which needs its wasm_js backend on wasm32
# (plus the getrandom_backend cfg in .cargo/config.toml).
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
# k256's std feature (0.14) draws on getrandom 0.4 (through crypto-bigint),
# which needs its wasm_js feature on wasm32. The SDK never uses k256's RNG.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]
