[package]
name = "halcyon-xrpl-cli"
version = "0.3.0"
edition = "2021"
description = "hxrpl: the XRP Ledger from the command line — wallets, faucet, queries, signing, sending, hashes, ledger entry IDs, live streams — on halcyon-xrpl-sdk"
license-file = "../../LICENSE"
repository = "https://github.com/ilubxrp589/xrpl-sdk"
authors = ["James Turner"]
readme = "README.md"
homepage = "https://github.com/ilubxrp589/xrpl-sdk"
documentation = "https://docs.rs/halcyon-xrpl-sdk"
keywords = ["xrpl", "xrp", "ripple", "cli", "blockchain"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "hxrpl"
path = "src/main.rs"

[dependencies]
xrpl-sdk = { package = "halcyon-xrpl-sdk", path = "../xrpl-sdk", version = "0.3" }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
