[package]
name = "halcyon-xrpl-client"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
description = "XRP Ledger clients: one async Client trait over HTTP JSON-RPC, WebSocket (subscriptions, auto-reconnect) and browser WebSocket, with typed requests and responses"
license-file = "../../LICENSE"
repository = "https://github.com/ilubxrp589/xrpl-sdk"
authors = ["James Turner"]
readme = "../../README.md"
homepage = "https://github.com/ilubxrp589/xrpl-sdk"
documentation = "https://docs.rs/halcyon-xrpl-client"
keywords = ["xrpl", "xrp", "ripple", "blockchain", "sdk"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "network-programming", "wasm"]

[lib]
name = "xrpl_client"
crate-type = ["rlib"]

[dependencies]
xrpl-core = { package = "halcyon-xrpl-core", path = "../xrpl-core", version = "0.6" }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "EventTarget",
    "BinaryType",
    "console",
] }
futures = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
default = ["http"]
http = []
ws = []
full = ["http", "ws"]
live-tests = []
wasm = ["xrpl-core/wasm"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["http", "ws"]
rustdoc-args = ["--cfg", "docsrs"]
