[package]
name = "halcyon-xrpl-sdk"
version = "0.1.0"
edition = "2021"
description = "Community-built Rust SDK for the XRP Ledger"
license-file = "../../LICENSE"
repository = "https://github.com/ilubxrp589/xrpl-sdk"
authors = ["James Turner"]
readme = "../../README.md"
keywords = ["xrpl", "xrp", "ripple", "blockchain", "crypto"]
categories = ["cryptography", "api-bindings"]

[lib]
name = "xrpl_sdk"

[dependencies]
xrpl-core = { package = "halcyon-xrpl-core", path = "../xrpl-core", version = "0.1" }
xrpl-client = { package = "halcyon-xrpl-client", path = "../xrpl-client", version = "0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }

[features]
default = ["http"]
http = ["xrpl-client/http"]
ws = ["xrpl-client/ws"]
full = ["http", "ws"]
live-tests = ["xrpl-client/live-tests"]

[lints]
workspace = true
