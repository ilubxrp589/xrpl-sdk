[package]
name = "halcyon-xrpl-sdk"
version = "0.8.1"
edition = "2021"
rust-version = "1.88"
description = "Rust SDK for the XRP Ledger (XRPL): wallets, signing, multisign, autofill and submit, HTTP and WebSocket clients, typed ledger objects, hashes, faucet; checked against rippled"
license = "Apache-2.0"
repository = "https://github.com/ilubxrp589/xrpl-sdk"
authors = ["James Turner"]
readme = "../../README.md"
documentation = "https://docs.rs/halcyon-xrpl-sdk"
keywords = ["xrpl", "xrp", "ripple", "blockchain", "sdk"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "network-programming"]

[lib]
name = "xrpl_sdk"

[dependencies]
xrpl-core = { package = "halcyon-xrpl-core", path = "../xrpl-core", version = "0.8" }
xrpl-client = { package = "halcyon-xrpl-client", path = "../xrpl-client", version = "0.8", default-features = false }
serde_json = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
default = ["http", "ws"]
# The HTTP client, the faucet and BlockingClient (halcyon-xrpl-client's `http`).
http = ["xrpl-client/http"]
# The WebSocket client (halcyon-xrpl-client's `ws`).
ws = ["xrpl-client/ws"]
# The browser / Node.js build (wasm32-unknown-unknown).
wasm = ["xrpl-core/wasm", "xrpl-client/wasm"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["http", "ws"]
rustdoc-args = ["--cfg", "docsrs"]

# The cookbook talks to Testnet (or mainnet) over HTTP, two over WebSocket.
