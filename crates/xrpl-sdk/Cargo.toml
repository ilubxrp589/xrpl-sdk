[package]
name = "halcyon-xrpl-sdk"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
description = "Rust SDK for the XRP Ledger (XRPL): wallets, signing, multisign, autofill and submit, HTTP and WebSocket clients, typed ledger objects, hashes, faucet; checked against rippled"
license = "Apache-2.0"
repository = "https://github.com/ilubxrp589/xrpl-sdk"
authors = ["James Turner"]
readme = "../../README.md"
documentation = "https://docs.rs/halcyon-xrpl-sdk"
keywords = ["xrpl", "xrp", "ripple", "blockchain", "sdk"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "network-programming"]

[lib]
name = "xrpl_sdk"

[dependencies]
xrpl-core = { package = "halcyon-xrpl-core", path = "../xrpl-core", version = "0.8" }
xrpl-client = { package = "halcyon-xrpl-client", path = "../xrpl-client", version = "0.8" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }

[features]
default = ["http"]
http = ["xrpl-client/http"]
ws = ["xrpl-client/ws"]
full = ["http", "ws"]
live-tests = ["xrpl-client/live-tests"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]
